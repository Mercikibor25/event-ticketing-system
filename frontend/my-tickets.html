<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - EventBook Kenya</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
    <a href="index.html" class="nav-brand">🎟 EventBook</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="my-tickets.html">My Tickets</a></li>
        <li id="nav-auth" style="display:flex; gap:0.5rem;">
            <a href="login.html">Login</a>
            <a href="register.html" class="btn-nav">Register</a>
        </li>
        <li id="nav-user" style="display:none; gap:0.5rem; align-items:center;">
            <a href="my-tickets.html" id="nav-username">Account</a>
            <a href="admin.html" id="nav-admin" style="display:none;">Admin</a>
            <a href="#" onclick="logout()" class="btn-nav">Logout</a>
        </li>
    </ul>
</nav>

<!-- TICKETS SECTION -->
<div class="container">
    <div class="page-header">
        <h2>My Tickets</h2>
        <p>All your booked event tickets</p>
    </div>

    <div id="alert-container"></div>
    <div id="tickets-container">
        <div class="loading">Loading your tickets...</div>
    </div>
</div>

<!-- QR CODE MODAL -->
<div id="qr-modal" style="display:none; position:fixed; top:0; left:0; 
     width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:200;
     justify-content:center; align-items:center;">
    <div style="background:white; border-radius:12px; padding:2rem;
                width:90%; max-width:380px; text-align:center;">
        <h3 style="margin-bottom:0.5rem;">Your Ticket QR Code</h3>
        <p style="color:var(--text-light); font-size:0.85rem; margin-bottom:1rem;">
            Show this at the entrance
        </p>
        <img id="qr-image" src="" alt="QR Code"
             style="width:220px; height:220px; border:1px solid var(--border);
                    border-radius:8px; margin-bottom:1rem;">
        <p id="qr-ticket-id"
           style="font-size:0.75rem; color:var(--text-light);
                  word-break:break-all; margin-bottom:1.5rem;"></p>
        <button class="btn btn-primary btn-full" onclick="closeQrModal()">
            Close
        </button>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        updateNav();
        showAdminLink();

        // Redirect to login if not logged in
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
            return;
        }
        loadTickets();
    });

    function showAdminLink() {
        const user = getUser();
        const adminLink = document.getElementById('nav-admin');
        if (adminLink && user.role === 'admin') {
            adminLink.style.display = 'inline-block';
        }
    }

    async function loadTickets() {
        const container = document.getElementById('tickets-container');

        try {
            const response = await api.getMyTickets();
            const tickets = await response.json();

            if (tickets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No tickets yet</h3>
                        <p>Browse events and book your first ticket</p>
                        <br>
                        <a href="index.html" class="btn btn-primary">Browse Events</a>
                    </div>`;
                return;
            }

            container.innerHTML = tickets.map(ticket => `
                <div class="ticket-card">
                    <div style="flex:1;">
                        <h3>${ticket.event_title}</h3>
                        <p>📅 ${formatDate(ticket.event_date)}</p>
                        <p>📍 ${ticket.event_venue}</p>
                        <p>
                            Status:
                            <span class="badge ${getStatusBadge(ticket.status)}">
                                ${ticket.status}
                            </span>
                        </p>
                        <p class="ticket-id">Ticket ID: ${ticket.ticket_id}</p>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        ${ticket.qr_code ? `
                            <button class="btn btn-primary"
                                onclick="showQrCode('${ticket.qr_code}', '${ticket.ticket_id}')">
                                View QR Code
                            </button>` : ''
                        }
                        ${getPaymentButton(ticket)}
                    </div>
                </div>
            `).join('');

        } catch (error) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>Could not load tickets</h3>
                    <p>Make sure the server is running</p>
                </div>`;
        }
    }

    function getStatusBadge(status) {
        const badges = {
            'active':    'badge-upcoming',
            'used':      'badge-ongoing',
            'cancelled': 'badge-sold-out'
        };
        return badges[status] || 'badge-upcoming';
    }

    function getPaymentButton(ticket) {
        if (!ticket.payment) {
            return `<button class="btn btn-success"
                        onclick="openPaymentModal(${ticket.id})">
                        Pay Now
                    </button>`;
        }
        return `<span class="badge badge-ongoing">✓ Paid</span>`;
    }

    // Payment inline (without navigating away)
    let selectedTicketId = null;

    function openPaymentModal(ticketId) {
        selectedTicketId = ticketId;
        const phone = prompt('Enter your M-Pesa phone number (e.g. 0712345678):');
        if (!phone) return;
        initiatePayment(ticketId, phone);
    }

    async function initiatePayment(ticketId, phone) {
        try {
            const response = await api.initiatePayment({
                ticket_id: ticketId,
                phone_number: phone
            });

            const data = await response.json();

            if (response.ok) {
                showAlert('alert-container',
                    '✓ M-Pesa prompt sent! Check your phone and enter your PIN.',
                    'success');
            } else {
                showAlert('alert-container',
                    data.error || 'Payment failed. Try again.', 'error');
            }

        } catch (error) {
            showAlert('alert-container', 'Server error. Try again.', 'error');
        }
    }

    // QR Code modal
    function showQrCode(qrUrl, ticketId) {
        document.getElementById('qr-image').src = qrUrl;
        document.getElementById('qr-ticket-id').textContent = `Ticket ID: ${ticketId}`;
        document.getElementById('qr-modal').style.display = 'flex';
    }

    function closeQrModal() {
        document.getElementById('qr-modal').style.display = 'none';
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-KE', {
            weekday: 'short',
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
</script>

</body>
</html>
