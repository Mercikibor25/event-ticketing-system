<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EventBook Kenya</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
    <a href="index.html" class="nav-brand">🎟 EventBook</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li id="nav-auth" style="display:flex; gap:0.5rem;">
            <a href="login.html">Login</a>
            <a href="register.html" class="btn-nav">Register</a>
        </li>
    </ul>
</nav>

<!-- FORGOT PASSWORD FORM -->
<div class="container">
    <div class="form-card">
        <h2 class="form-title">Reset Password</h2>
        <p style="text-align:center; color:var(--text-light); 
                  margin-bottom:1.5rem; font-size:0.9rem;">
            Enter your email address and we will send you 
            a password reset link via SMS.
        </p>

        <div id="alert-container"></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email address">
        </div>

        <button class="btn btn-primary btn-full" onclick="resetPassword()">
            Send Reset Link
        </button>

        <div class="form-footer">
            Remember your password? <a href="login.html">Login here</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    async function resetPassword() {
        const email = document.getElementById('email').value.trim();

        if (!email) {
            showAlert('alert-container', 'Please enter your email address.', 'error');
            return;
        }

        const btn = document.querySelector('.btn-primary');
        btn.textContent = 'Sending...';
        btn.disabled = true;

        try {
            const response = await fetch(`${API_BASE}/accounts/password-reset/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok) {
                showAlert('alert-container',
                    'Password reset instructions have been sent to your email.',
                    'success');
            } else {
                showAlert('alert-container',
                    data.error || 'Email not found. Please check and try again.',
                    'error');
            }

        } catch (error) {
            showAlert('alert-container',
                'Could not connect to server. Try again.', 'error');
        }

        btn.textContent = 'Send Reset Link';
        btn.disabled = false;
    }
</script>

</body>
</html>
